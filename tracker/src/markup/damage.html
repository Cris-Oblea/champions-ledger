    <!-- =========================================================== CALC -->
    <section class="view" id="v-calc" role="tabpanel" hidden>
      <!-- the answer stays put while you change what feeds it: this is the
           whole reason the page exists, and it used to sit below the fold -->
      <div class="calcresult" id="calcOut">
        <div class="empty">Pick an attacker, a move and a defender.</div>
      </div>

      <fieldset class="seg" id="calcMode" aria-label="Battle format">
        <button data-mode="Doubles" aria-pressed="true">Doubles</button>
        <button data-mode="Singles" aria-pressed="false">Singles</button>
      </fieldset>

      <div class="calcgrid">
        <section class="calccol">
          <h2>Attacker</h2>
          <div id="calcAtk"></div>
          <h2>Move</h2>
          <button class="slot blank" id="calcMove"></button>
        </section>

        <section class="calccol">
          <h2>The field</h2>
          <div class="toggles" id="calcField"></div>
        </section>

        <section class="calccol">
          <h2>Defender</h2>
          <div id="calcDef"></div>
        </section>
      </div>

      <!-- THE STATUS REFERENCE lives here, not with the Items: a status is not
           gear - you are afflicted by one - and what it is worth knowing for
           is the multiplier it puts on a damage roll, next to the field
           toggles that apply it. FOLDED and shut by default: it is a
           dictionary you read once, and open it would push the answer down
           the screen. -->
      <div class="foldwrap">
        <button class="btn sm fold" id="statusFold" aria-expanded="false"
          aria-controls="statusBody">Status effects — what each does to
          the numbers</button>
        <div id="statusBody" hidden>
          <p class="sub">Champions rebalanced three of them; every value says
            where it came from, so a figure nobody measured here never looks
            like one that was.</p>
          <div id="statusList" class="list"></div>
        </div>
      </div>
    </section>
