<!-- THE APP'S OWN CONFIRM. `confirm()` draws the operating system's dialog in
     the middle of a designed app: another typeface, another button order,
     another set of words, and on a phone it arrives at the top of the screen
     far from the thumb that asked for it. Seven of them were in here, and
     every one of them guards something irreversible - deleting a build,
     buying a rental into Champions origin, closing a trade.

     z-index 70: above the sheet (60), below the toast (80), because several
     of these are asked FROM an open sheet and must not fight it for the
     scrim. -->
<div class="scrim askscrim" id="askScrim" hidden>
  <div class="askbox" role="alertdialog" aria-modal="true"
       aria-labelledby="askTitle" aria-describedby="askBody">
    <h3 id="askTitle">Confirm</h3>
    <div id="askBody"></div>
    <div class="askfoot">
      <button class="btn" id="askNo">Cancel</button>
      <button class="btn primary" id="askYes">OK</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden><dialog class="sheet" open aria-modal="true">
  <div class="sheethead"><h3 id="sheetTitle">Details</h3>
    <button class="iconbtn" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button></div>
  <div class="sheetbody" id="sheetBody"></div>
  <div class="sheetfoot" id="sheetFoot"></div>
</dialog></div>

<output class="toast" id="toast" aria-live="polite" hidden></output>
<div class="booterr" id="bootErr" hidden></div>

<!-- Sign-in gate. Shown until there is a session; the page behind it holds no
     data of its own, so a visitor without credentials gets nothing. -->
<div class="gate" id="gate" hidden>
  <form class="gatebox" id="gateForm">
    <h1>Champions Ledger</h1>
    <p class="lede" id="gateLede">Sign in to load your box.</p>
    <div class="field">
      <label class="f" for="gateEmail">Email</label>
      <input type="email" id="gateEmail" autocomplete="username" required>
    </div>
    <div class="field">
      <label class="f" for="gatePass">Password</label>
      <input type="password" id="gatePass" autocomplete="current-password" required>
    </div>
    <div class="note bad" id="gateErr" hidden></div>
    <button class="btn primary" id="gateBtn" type="submit">Sign in</button>
    <p class="sub" id="gateFoot" style="margin-top:14px"></p>
  </form>
</div>
