# The daily refresh, off the notebook.
#
# The same pipeline scripts/daily.py runs locally, on GitHub's machines, so
# the app keeps up with the ladder whether or not any PC is switched on.
#
# Three things make this work rather than just "run refresh.py":
#
#  * data/raw is NOT in git - it is 195 MB of fetched HTML. It is restored
#    from the Actions cache instead, which reproduces the skip-if-cached
#    behaviour the fetchers expect. A cache miss is harmless: everything is
#    simply re-downloaded.
#  * The correctness gate lives in daily.py, not here. If the damage selftest
#    or the name-matching test fails, it refuses to deploy and the job fails
#    loudly. A stale app beats a wrong one.
#  * Mondays run --deep, which forces Smogon's 324 written analyses and
#    Pikalytics. Both skip anything already cached, so without it they would
#    freeze for good.
#
# A REGULATION still needs a human: `refresh.py --regulation` clears the
# Serebii page caches, and getting that wrong leaves new species with no
# movepool. Run it by hand, then let this take over again.

name: daily refresh

on:
  schedule:
    - cron: "30 8 * * *"      # 08:30 UTC ~= 05:30 in Chile (UTC-3)
  workflow_dispatch:
    inputs:
      deep:
        description: "Force Smogon analyses and Pikalytics too"
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # a cold run - no cache at all - measured 34 minutes, almost all of it
    # fetching Serebii's dex and attackdex pages. 45 left too little headroom
    # for a slow day upstream.
    timeout-minutes: 70
    # GITHUB_TOKEN's own permissions, which now cover only the deploy half of
    # this job. The branch push and the pull request are done with a GitHub App
    # token instead - see the step that mints it.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # Without this, checkout leaves GITHUB_TOKEN in the local git config
          # as an `http.https://github.com/.extraheader`, and that Authorization
          # header OVERRIDES the credentials in a push URL. So the push below
          # went out as github-actions[bot] - which may now only read - and
          # returned "Permission to Cris-Oblea/champions-ledger.git denied to
          # github-actions[bot]", 403, with an App token sitting right there
          # unused. Nothing in this job fetches over the network after the
          # checkout, so persisting no credential costs nothing.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # From v5 this action caches the package manager by itself when
          # package.json names one. Ours does not, and the gate's `npm install`
          # writes the lockfile it would key on, so say no rather than leave it
          # to what a future major decides the default should be.
          package-manager-cache: false

      # the fetchers' own cache. Keyed by run number so each day writes a new
      # entry and restore-keys picks up yesterday's - Actions caches are
      # immutable once written, so a fixed key would freeze on day one.
      # restore and save are SEPARATE actions on purpose. actions/cache saves
      # in a post step that is skipped when the job fails - so the first run
      # failed, saved nothing, and the next one would have paid the same 34
      # minutes of cold fetching again. With an explicit save under
      # `if: always()`, a run that fetched everything still leaves the cache
      # warm for the next one even if it died later.
      - name: restore the source cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: sources-${{ github.run_number }}
          restore-keys: sources-

      - name: install what the scripts import
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # jsdom, for the browser tests in daily.py's gate. Without it they
          # cannot run at all, which is how four of them drifted unnoticed.
          npm install --no-audit --no-fund

      # Refreshes and gates, and does NOT deploy. The deploy belongs to the push
      # to main that the merge below now produces - push.yml's job, on the
      # content that actually landed.
      #
      # It used to deploy from here because the merge triggered nothing: it was
      # made with GITHUB_TOKEN, and GitHub starts no workflow for that. The App
      # merges now, so main gets a real run, and deploying from both was the same
      # page published twice a night.
      #
      # The consequence is the right one: if the gate on the pull request fails,
      # the PR stays open and NOTHING is deployed. Data that did not pass no
      # longer reaches the phone by a side door - which is exactly what deploying
      # from here, before the PR existed, was doing.
      #
      # Hence no Cloudflare credentials in this step any more. The Supabase pair
      # stays: it is baked into the page at build time, and the page is built
      # here, for the gate to have something to check.
      - name: refresh and verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python scripts/daily.py --skip-deploy ${{ (github.event_name == 'workflow_dispatch' && inputs.deep) && '--deep' || '' }}

      # main is a protected branch now: it takes pull requests only, and the
      # gate must be green. A bot pushing straight to it is exactly what that
      # protects against, so the refresh goes through the same door as a person.
      #
      # THE PULL REQUEST IS GATED FOR REAL, and this job no longer says so on its
      # own behalf. The history is worth keeping, because the old arrangement
      # looked reasonable and was not:
      #
      # A PR opened with GITHUB_TOKEN does get a workflow run - GitHub creates it
      # and then refuses to execute it, zero jobs, `failure`, created and updated
      # in the same second. So the required `gate` check never arrived and the PR
      # would have sat open for ever waiting for itself. The answer was to post
      # the status by hand, from this job, reporting the gate daily.py had just
      # run on this very tree.
      #
      # Which worked, and hid a hazard: two writers for one context. If the real
      # gate ever ran and FAILED, whichever reported last would win, and a green
      # written here could mask it. A check nobody can fail is not a check.
      #
      # The App token above fixes the cause instead. push.yml runs on the PR and
      # reports `gate` itself, so the merge waits for it - and a nightly whose
      # gate fails now leaves its pull request OPEN rather than merging, which is
      # what should happen to data that did not pass - and since the deploy moved
      # to the merge, an open pull request means the phone keeps yesterday's data
      # rather than being handed data that failed.
      #
      # REQUIRES A REPOSITORY SETTING that exists nowhere in this file:
      # Settings > Actions > General > Workflow permissions > "Allow GitHub
      # Actions to create and approve pull requests". It was off until
      # 2026-09-13 and stranded two nights' refreshes on orphan `daily/*`
      # branches - the refresh ran, the deploy went out, the branch was pushed,
      # and only `gh pr create` was refused. Runs where no source moved exit
      # before this step and pass, so the workflow looked healthy in between.
      # Minted HERE, not at the top of the job: an installation token lasts one
      # hour, a cold refresh has measured 34 minutes and this job may run for 70.
      # A token taken before the fetching would be the one thing in the chain
      # that expires, on exactly the slow morning it is most needed.
      #
      # The App's own private key has no expiry - the same rule the backup
      # follows. A fine-grained PAT would have lasted a year at most, and a
      # classic one with no expiry would have carried the whole account; the App
      # reaches this repository, with Contents and Pull requests and deliberately
      # NOT Workflows: write. The refresh commits data/db, data/meta, tracker/*
      # and README.md, so without that permission it cannot touch
      # .github/workflows at all, and the day something needs it to, the push
      # fails loudly and that is the right place to decide.
      - name: mint a token as the app
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: open a pull request and let it merge itself
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name  "champions-ledger bot"
          git config user.email "noreply@github.com"
          # index.html is NOT committed: it is generated from the template on
          # every run, here and locally, so versioning it made a merge
          # conflict inevitable on any day both happened.
          # README.md belongs in this list because its counts are GENERATED
          # from data/db - refresh.py rewrites them in this very run, and the
          # gate above just checked them. Leaving it out meant every refresh
          # that moved a count left main's README behind and the next person to
          # push was blocked by "README is OUT OF DATE" for a drift they did not
          # cause. Smogon publishing 35 more analyses was enough to do it.
          git add -A data/db data/meta tracker/data.js tracker/engine.bundle.js README.md || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          BR="daily/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BR"
          git commit -m "daily refresh $(date -u +%Y-%m-%d)"
          # The checkout persisted GITHUB_TOKEN, which may now only read, so the
          # writes below carry the App token in the URL instead. The action
          # registers that token as a secret, so it is masked in the log.
          AUTH="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          git push "$AUTH" "HEAD:refs/heads/$BR"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh pr create --base main --head "$BR" --title "daily refresh $(date -u +%Y-%m-%d)" --body "Automated. daily.py refreshed every source and passed the whole gate on this tree before the branch existed. Opened by the champions-ledger-bot app so the gate runs on the pull request too, and set to merge itself once it is green - the merge is what deploys. Log: $RUN"
          # --auto FIRST, which is the other way round from before. Nothing has
          # reported `gate` on this PR yet - push.yml is only just starting on it
          # and takes about eighty seconds - so the PR is not mergeable and
          # auto-merge is precisely what applies. The direct merge stays as the
          # fallback for the day a check reports faster than this line runs,
          # since --auto is refused outright on an already-mergeable PR.
          gh pr merge --auto --squash --delete-branch "$BR" || gh pr merge --squash --delete-branch "$BR"
          echo "queued to merge when the gate is green: $(gh pr view "$BR" --json url --jq .url)"
          # And sweep up any branch an EARLIER run stranded, which is what a
          # failed merge leaves behind - two of them sat there tonight. No loss:
          # this run refreshed from the same sources, so it holds everything the
          # stranded one held.
          git ls-remote --heads "$AUTH" "refs/heads/daily/*" | awk '{print $2}' | sed 's|refs/heads/||' | grep -vx "$BR" | while read -r old; do echo "removing the branch $old"; git push -q "$AUTH" --delete "$old" || true; done

      - name: save the source cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: sources-${{ github.run_number }}

      - name: keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-log
          path: data/raw/daily_logs/
          retention-days: 30
          if-no-files-found: ignore
