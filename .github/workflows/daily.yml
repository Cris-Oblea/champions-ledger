# The daily refresh, off the notebook.
#
# The same pipeline scripts/daily.py runs locally, on GitHub's machines, so
# the app keeps up with the ladder whether or not any PC is switched on.
#
# Three things make this work rather than just "run refresh.py":
#
#  * data/raw is NOT in git - it is 195 MB of fetched HTML. It is restored
#    from the Actions cache instead, which reproduces the skip-if-cached
#    behaviour the fetchers expect. A cache miss is harmless: everything is
#    simply re-downloaded.
#  * The correctness gate lives in daily.py, not here. If the damage selftest
#    or the name-matching test fails, it refuses to deploy and the job fails
#    loudly. A stale app beats a wrong one.
#  * Mondays run --deep, which forces Smogon's written analyses, Pikalytics
#    and pokebase's per-Pokemon splits. All three skip anything already
#    cached, so without it they would freeze for good.
#
#    THIS WAS A COMMENT AND NOT A BEHAVIOUR until 2026-09-15. The flag was
#    wired to `workflow_dispatch` alone, so --deep only ever ran when a person
#    clicked it by hand, and the three slow sources had not been re-fetched by
#    the schedule at all. It is decided below, in one step, and the run log
#    prints which mode it chose - a flag nobody can see is how this went
#    unnoticed. The player's requirement is that the usage percentages stay
#    live on their own (2026-09-15: "debes pensar en el % de uso de items,
#    moves, ability, nature como algo actualizable como se hace con el ladder
#    en gts").
#
# A REGULATION still needs a human: `refresh.py --regulation` clears the
# Serebii page caches, and getting that wrong leaves new species with no
# movepool. Run it by hand, then let this take over again.

name: daily refresh

# THREE ATTEMPTS, NOT ONE, AND NOT ON THE HALF HOUR.
#
# GitHub delays scheduled workflows on shared runners when the queue is busy,
# and drops them outright when it is very busy. Measured here rather than
# assumed - one cron at 08:30 UTC fired at 12:16, at 13:24 and at 15:10 on
# three consecutive days, four to seven hours late every time. The backup job,
# on 07:00, was 6h30 late the same week. Both were on the two busiest minutes
# there are: everybody's cron says :00 or :30.
#
# So: an odd minute, and three chances instead of one. Whichever attempt
# GitHub actually honours first does the run; the ones after it see that the
# day's refresh already succeeded and stop in seconds. That is the guard in
# "has today already run?" below, and it reads the workflow's own history, so
# there is no state file to go stale.
#
# What this does NOT do is make the job punctual. Nothing here can - the only
# way to be sure of the hour is to trigger from outside GitHub. This makes it
# reliably ONCE A DAY, closer to the morning, which is what the job is for.
on:
  schedule:
    - cron: "7 8 * * *"       # 08:07 UTC ~= 05:07 in Chile (UTC-3)
    - cron: "7 11 * * *"      # and two fallbacks, in case the first is
    - cron: "7 14 * * *"      # delayed past usefulness or dropped
  workflow_dispatch:
    inputs:
      deep:
        description: "Force Smogon analyses, Pikalytics and the splits too"
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # a cold run - no cache at all - measured 34 minutes, almost all of it
    # fetching Serebii's dex and attackdex pages. 45 left too little headroom
    # for a slow day upstream.
    timeout-minutes: 70
    # GITHUB_TOKEN's own permissions, which now cover only the deploy half of
    # this job. The branch push and the pull request are done with a GitHub App
    # token instead - see the step that mints it.
    #
    # `pull-requests: read` is for the guard below, which asks whether a
    # daily pull request is still open before deciding the day is done. It
    # reads; the one that WRITES a pull request is the App.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          # Without this, checkout leaves GITHUB_TOKEN in the local git config
          # as an `http.https://github.com/.extraheader`, and that Authorization
          # header OVERRIDES the credentials in a push URL. So the push below
          # went out as github-actions[bot] - which may now only read - and
          # returned "Permission to Cris-Oblea/champions-ledger.git denied to
          # github-actions[bot]", 403, with an App token sitting right there
          # unused. Nothing in this job fetches over the network after the
          # checkout, so persisting no credential costs nothing.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7
        with:
          node-version: "22"
          # From v5 this action caches the package manager by itself when
          # package.json names one. Ours does not - and now that
          # package-lock.json is committed the auto-cache would finally have
          # something to key on, which is exactly why it stays off explicitly
          # instead of being left to whatever a future major picks as default.
          # One dev dependency is not worth a cache; a surprise inside the
          # gate's install is worth less still.
          package-manager-cache: false

      # the fetchers' own cache. Keyed by run number so each day writes a new
      # entry and restore-keys picks up yesterday's - Actions caches are
      # immutable once written, so a fixed key would freeze on day one.
      # restore and save are SEPARATE actions on purpose. actions/cache saves
      # in a post step that is skipped when the job fails - so the first run
      # failed, saved nothing, and the next one would have paid the same 34
      # minutes of cold fetching again. With an explicit save under
      # `if: always()`, a run that fetched everything still leaves the cache
      # warm for the next one even if it died later.
      - name: restore the source cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: data/raw
          key: sources-${{ github.run_number }}
          restore-keys: sources-

      - name: install what the scripts import
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # jsdom, for the browser tests in daily.py's gate. Without it they
          # cannot run at all, which is how four of them drifted unnoticed.
          # `npm ci`, not `npm install`: it installs exactly what
          # package-lock.json pins and fails if the lock and package.json have
          # drifted. With `install` and a caret range, the gate resolved jsdom
          # fresh on every run - so the seventeen browser tests could break one
          # morning on a version nobody chose.
          npm ci --no-audit --no-fund

      # Refreshes and gates, and does NOT deploy. The deploy belongs to the push
      # to main that the merge below now produces - push.yml's job, on the
      # content that actually landed.
      #
      # It used to deploy from here because the merge triggered nothing: it was
      # made with GITHUB_TOKEN, and GitHub starts no workflow for that. The App
      # merges now, so main gets a real run, and deploying from both was the same
      # page published twice a night.
      #
      # The consequence is the right one: if the gate on the pull request fails,
      # the PR stays open and NOTHING is deployed. Data that did not pass no
      # longer reaches the phone by a side door - which is exactly what deploying
      # from here, before the PR existed, was doing.
      #
      # Hence no Cloudflare credentials in this step any more. The Supabase pair
      # stays: it is baked into the page at build time, and the page is built
      # here, for the gate to have something to check.
      # Only the first attempt of the day does the work. It asks the workflow's
      # own run history rather than keeping a file: a state file in a fresh
      # checkout is either not there or not trustworthy, and this question -
      # "did a run of this workflow already succeed today?" - is one the API
      # answers exactly. The run doing the asking is `in_progress`, so it never
      # matches itself.
      #
      # It fails OPEN: if the query errors, the refresh goes ahead. A missed
      # refresh is worse than a duplicated one, and a duplicate costs nothing
      # but ten minutes on a public runner.
      - name: has today already run?
        id: already
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          done=$(gh run list --workflow "daily refresh" --limit 20 \
                   --json createdAt,conclusion \
                   --jq "[.[] | select(.conclusion==\"success\" and (.createdAt | startswith(\"$today\")))] | length" \
                 2>/dev/null || echo 0)
          # A RUN THAT SUCCEEDED IS NOT A REFRESH THAT LANDED, and the
          # difference cost a whole day on 2026-09-20. That morning it did
          # everything right - refreshed every source, passed the gate on its
          # own tree, pushed the branch, opened the pull request - and then the
          # PR's own gate failed, so it sat open and nothing reached the phone.
          # Both fallbacks saw "a run succeeded today" and stopped. The day was
          # only rescued because a person noticed.
          #
          # So an OPEN daily/* pull request means the day is NOT done, whatever
          # the run history says: the last attempt is stuck and this one should
          # go again. Its push replaces the branch and the sweep at the end of
          # this job deletes the stranded one, so it converges instead of
          # piling up.
          stuck=$(gh pr list --state open --limit 20 \
                    --json headRefName \
                    --jq '[.[] | select(.headRefName | startswith("daily/"))] | length' \
                  2>/dev/null || echo 0)
          if [ "${stuck:-0}" -gt 0 ]; then
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "$stuck daily pull request(s) still open - the last attempt did"
            echo "not land. Refreshing again."
          elif [ "${done:-0}" -gt 0 ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "A refresh already landed today ($done run(s), nothing open)."
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      # WEEKLY, AND SAID OUT LOUD. Monday in UTC - the schedule runs at 08:07
      # UTC, so the date the runner sees is the date intended. A manual run
      # with the box ticked forces it on any day.
      - name: deep today?
        id: mode
        run: |
          asked="${{ github.event_name }}/${{ inputs.deep }}"
          if [ "$asked" = "workflow_dispatch/true" ]; then
            echo "deep=--deep" >> "$GITHUB_OUTPUT"
            echo "DEEP: asked for by hand"
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "deep=--deep" >> "$GITHUB_OUTPUT"
            echo "DEEP: it is Monday - Smogon, Pikalytics and the pokebase splits"
          else
            echo "deep=" >> "$GITHUB_OUTPUT"
            echo "normal refresh: the nightly sources only"
          fi

      - name: refresh and verify
        if: steps.already.outputs.skip != 'yes' 
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python scripts/daily.py --skip-deploy ${{ steps.mode.outputs.deep }}

      # main is a protected branch now: it takes pull requests only, and the
      # gate must be green. A bot pushing straight to it is exactly what that
      # protects against, so the refresh goes through the same door as a person.
      #
      # THE PULL REQUEST IS GATED FOR REAL, and this job no longer says so on its
      # own behalf. The history is worth keeping, because the old arrangement
      # looked reasonable and was not:
      #
      # A PR opened with GITHUB_TOKEN does get a workflow run - GitHub creates it
      # and then refuses to execute it, zero jobs, `failure`, created and updated
      # in the same second. So the required `gate` check never arrived and the PR
      # would have sat open for ever waiting for itself. The answer was to post
      # the status by hand, from this job, reporting the gate daily.py had just
      # run on this very tree.
      #
      # Which worked, and hid a hazard: two writers for one context. If the real
      # gate ever ran and FAILED, whichever reported last would win, and a green
      # written here could mask it. A check nobody can fail is not a check.
      #
      # The App token above fixes the cause instead. push.yml runs on the PR and
      # reports `gate` itself, so the merge waits for it - and a nightly whose
      # gate fails now leaves its pull request OPEN rather than merging, which is
      # what should happen to data that did not pass - and since the deploy moved
      # to the merge, an open pull request means the phone keeps yesterday's data
      # rather than being handed data that failed.
      #
      # REQUIRES A REPOSITORY SETTING that exists nowhere in this file:
      # Settings > Actions > General > Workflow permissions > "Allow GitHub
      # Actions to create and approve pull requests". It was off until
      # 2026-09-13 and stranded two nights' refreshes on orphan `daily/*`
      # branches - the refresh ran, the deploy went out, the branch was pushed,
      # and only `gh pr create` was refused. Runs where no source moved exit
      # before this step and pass, so the workflow looked healthy in between.
      # Minted HERE, not at the top of the job: an installation token lasts one
      # hour, a cold refresh has measured 34 minutes and this job may run for 70.
      # A token taken before the fetching would be the one thing in the chain
      # that expires, on exactly the slow morning it is most needed.
      #
      # The App's own private key has no expiry - the same rule the backup
      # follows. A fine-grained PAT would have lasted a year at most, and a
      # classic one with no expiry would have carried the whole account; the App
      # reaches this repository, with Contents and Pull requests and deliberately
      # NOT Workflows: write. The refresh commits data/db, data/meta, tracker/*
      # and README.md, so without that permission it cannot touch
      # .github/workflows at all, and the day something needs it to, the push
      # fails loudly and that is the right place to decide.
      - name: mint a token as the app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1   # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: open a pull request and let it merge itself
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name  "champions-ledger bot"
          git config user.email "noreply@github.com"
          # index.html is NOT committed: it is generated from the template on
          # every run, here and locally, so versioning it made a merge
          # conflict inevitable on any day both happened.
          # README.md belongs in this list because its counts are GENERATED
          # from data/db - refresh.py rewrites them in this very run, and the
          # gate above just checked them. Leaving it out meant every refresh
          # that moved a count left main's README behind and the next person to
          # push was blocked by "README is OUT OF DATE" for a drift they did not
          # cause. Smogon publishing 35 more analyses was enough to do it.
          # STATUS.md is in this list for the same reason README.md is: its
          # counts are GENERATED from data/db and data/meta, so this very run
          # rewrites them and the gate then checks them. Leaving it out is not
          # a stale file, it is a BLOCKED NIGHTLY - the refresh regenerates
          # STATUS, does not commit it, and its own pull request fails on
          # "STATUS.md OUT OF DATE" every single night. Which is exactly what
          # happened on 2026-09-20, the first night after STATUS joined the
          # generator.
          git add -A data/db data/meta tracker/data.js tracker/analysis.js tracker/splits.js tracker/engine.bundle.js README.md STATUS.md || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          BR="daily/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BR"
          git commit -m "daily refresh $(date -u +%Y-%m-%d)"
          # The checkout persisted GITHUB_TOKEN, which may now only read, so the
          # writes below carry the App token in the URL instead. The action
          # registers that token as a secret, so it is masked in the log.
          AUTH="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          git push "$AUTH" "HEAD:refs/heads/$BR"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # A REGULATION IS NOT A DAILY REFRESH, and the title should not
          # pretend otherwise. data/db/regulation.json records what the
          # database is built for, so git already knows: if it moved in this
          # run, the sources changed regulation and refresh.py ran the recipe
          # that clears Serebii's caches. That is the one night worth reading
          # the diff on.
          TITLE="daily refresh $(date -u +%Y-%m-%d)"
          if git diff --name-only "origin/main..$BR" | grep -qx "data/db/regulation.json"; then
            REG=$(python -c "import json;print(json.load(open('data/db/regulation.json'))['label'])" 2>/dev/null || echo "?")
            TITLE="REGULATION $REG - $TITLE"
          fi
          gh pr create --base main --head "$BR" --title "$TITLE" --body "Automated. daily.py refreshed every source and passed the whole gate on this tree before the branch existed. Opened by the champions-ledger-bot app so the gate runs on the pull request too, and set to merge itself once it is green - the merge is what deploys. Log: $RUN"
          # --auto FIRST, which is the other way round from before. Nothing has
          # reported `gate` on this PR yet - push.yml is only just starting on it
          # and takes about eighty seconds - so the PR is not mergeable and
          # auto-merge is precisely what applies. The direct merge stays as the
          # fallback for the day a check reports faster than this line runs,
          # since --auto is refused outright on an already-mergeable PR.
          gh pr merge --auto --squash --delete-branch "$BR" || gh pr merge --squash --delete-branch "$BR"
          echo "queued to merge when the gate is green: $(gh pr view "$BR" --json url --jq .url)"
          # And sweep up any branch an EARLIER run stranded, which is what a
          # failed merge leaves behind - two of them sat there tonight. No loss:
          # this run refreshed from the same sources, so it holds everything the
          # stranded one held.
          git ls-remote --heads "$AUTH" "refs/heads/daily/*" | awk '{print $2}' | sed 's|refs/heads/||' | grep -vx "$BR" | while read -r old; do echo "removing the branch $old"; git push -q "$AUTH" --delete "$old" || true; done

      - name: save the source cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6
        with:
          path: data/raw
          key: sources-${{ github.run_number }}

      - name: keep the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: daily-log
          path: data/raw/daily_logs/
          retention-days: 30
          if-no-files-found: ignore
