# The daily refresh, off the notebook.
#
# The same pipeline scripts/daily.py runs locally, on GitHub's machines, so
# the app keeps up with the ladder whether or not any PC is switched on.
#
# Three things make this work rather than just "run refresh.py":
#
#  * data/raw is NOT in git - it is 195 MB of fetched HTML. It is restored
#    from the Actions cache instead, which reproduces the skip-if-cached
#    behaviour the fetchers expect. A cache miss is harmless: everything is
#    simply re-downloaded.
#  * The correctness gate lives in daily.py, not here. If the damage selftest
#    or the name-matching test fails, it refuses to deploy and the job fails
#    loudly. A stale app beats a wrong one.
#  * Mondays run --deep, which forces Smogon's 324 written analyses and
#    Pikalytics. Both skip anything already cached, so without it they would
#    freeze for good.
#
# A REGULATION still needs a human: `refresh.py --regulation` clears the
# Serebii page caches, and getting that wrong leaves new species with no
# movepool. Run it by hand, then let this take over again.

name: daily refresh

on:
  schedule:
    - cron: "30 8 * * *"      # 08:30 UTC ~= 05:30 in Chile (UTC-3)
  workflow_dispatch:
    inputs:
      deep:
        description: "Force Smogon analyses and Pikalytics too"
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # a cold run - no cache at all - measured 34 minutes, almost all of it
    # fetching Serebii's dex and attackdex pages. 45 left too little headroom
    # for a slow day upstream.
    timeout-minutes: 70
    permissions:
      contents: write          # to push the refresh branch
      pull-requests: write     # to open and auto-merge it
      statuses: write          # to report the gate it just ran

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # From v5 this action caches the package manager by itself when
          # package.json names one. Ours does not, and the gate's `npm install`
          # writes the lockfile it would key on, so say no rather than leave it
          # to what a future major decides the default should be.
          package-manager-cache: false

      # the fetchers' own cache. Keyed by run number so each day writes a new
      # entry and restore-keys picks up yesterday's - Actions caches are
      # immutable once written, so a fixed key would freeze on day one.
      # restore and save are SEPARATE actions on purpose. actions/cache saves
      # in a post step that is skipped when the job fails - so the first run
      # failed, saved nothing, and the next one would have paid the same 34
      # minutes of cold fetching again. With an explicit save under
      # `if: always()`, a run that fetched everything still leaves the cache
      # warm for the next one even if it died later.
      - name: restore the source cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: sources-${{ github.run_number }}
          restore-keys: sources-

      - name: install what the scripts import
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # jsdom, for the browser tests in daily.py's gate. Without it they
          # cannot run at all, which is how four of them drifted unnoticed.
          npm install --no-audit --no-fund

      - name: refresh, verify, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python scripts/daily.py ${{ (github.event_name == 'workflow_dispatch' && inputs.deep) && '--deep' || '' }}

      # main is a protected branch now: it takes pull requests only, and the
      # gate must be green. A bot pushing straight to it is exactly what that
      # protects against, so the refresh goes through the same door as a person.
      #
      # The gate is NOT re-run for it. daily.py already ran all nineteen checks
      # on this very working tree in the step above and refused to deploy if
      # any failed - so the status posted here reports a check that genuinely
      # passed, on the content being merged. Re-running it would be two
      # identical runs and the same answer.
      #
      # Why a status rather than letting the PR trigger the gate workflow:
      # GitHub does not start workflows for pushes made with GITHUB_TOKEN, so
      # a pull_request run would never appear, the required check would never
      # arrive, and the PR would sit open for ever waiting for itself.
      #
      # REQUIRES A REPOSITORY SETTING that exists nowhere in this file:
      # Settings > Actions > General > Workflow permissions > "Allow GitHub
      # Actions to create and approve pull requests". Without it `gh pr create`
      # fails with "GitHub Actions is not permitted to create or approve pull
      # requests", and the failure is a confusing one to read: the refresh
      # worked, the deploy went out, the branch was pushed - only the PR was
      # refused, so the data sits on an orphan `daily/*` branch and main keeps
      # yesterday's. Worse, a run where nothing changed exits earlier than this
      # and passes, so the workflow looks healthy in between.
      #
      # Turning it on grants nothing here: main requires the `gate` status check
      # and ZERO approving reviews, so an approval from Actions is worth
      # nothing, and the check is enforced for admins too. It was off until
      # 2026-09-13 and two nights' refreshes were stranded by it.
      - name: open a pull request and let it merge itself
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "champions-ledger bot"
          git config user.email "noreply@github.com"
          # index.html is NOT committed: it is generated from the template on
          # every run, here and locally, so versioning it made a merge
          # conflict inevitable on any day both happened.
          # README.md belongs in this list because its counts are GENERATED
          # from data/db - refresh.py rewrites them in this very run, and the
          # gate above just checked them. Leaving it out meant every refresh
          # that moved a count left main's README behind and the next person to
          # push was blocked by "README is OUT OF DATE" for a drift they did not
          # cause. Smogon publishing 35 more analyses was enough to do it.
          git add -A data/db data/meta tracker/data.js tracker/engine.bundle.js README.md || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          BR="daily/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BR"
          git commit -m "daily refresh $(date -u +%Y-%m-%d)"
          git push origin "$BR"
          SHA=$(git rev-parse HEAD)
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=gate -f description="gated by daily.py in this run" -f target_url="$RUN"
          gh pr create --base main --head "$BR" --title "daily refresh $(date -u +%Y-%m-%d)" --body "Automated. daily.py refreshed every source and passed the shrink guard, four audits and fifteen browser tests before this branch existed; the gate status on the head commit reports that run. Merges itself once the check is green. Log: $RUN"
          # `gh pr merge --auto` is REFUSED when the pull request is already
          # mergeable - "Pull request is in clean status" - and the gate status
          # is posted two lines above it. So whether auto-merge is applicable at
          # all is a race against GitHub's own status propagation: PR #23 won it
          # and PR #25 lost it, fourteen minutes apart, with the refresh and the
          # deploy already done in both. Merge it outright if it can be, and
          # queue auto-merge only if it cannot.
          gh pr merge --squash --delete-branch "$BR" || gh pr merge --auto --squash --delete-branch "$BR"

      - name: save the source cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: sources-${{ github.run_number }}

      - name: keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-log
          path: data/raw/daily_logs/
          retention-days: 30
          if-no-files-found: ignore
