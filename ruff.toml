# The Python half of the lint gate: the same file drives the gate
# (python -m ruff check) and the Ruff extension in VS Code, so what the Problems
# panel shows is what blocks a push - the rule eslint.config.mjs follows for
# JavaScript.
#
# The rules are chosen to cover what SonarQube for IDE reported on this code,
# plus what Sonar has no rule for. Style-only families (quote style, printf
# formatting, line length) are left out: they would add hundreds of findings
# and make no file easier to read.
target-version = "py314"                # what CI runs: setup-python "3.x", the newest
extend-exclude = ["data", "graphify-out", "node_modules"]

[lint]
select = [
    "F",       # pyflakes: undefined names, unused imports and variables
    "E4", "E7", "E9", "W",  # pycodestyle: statements, imports, syntax
    "B",       # bugbear: the bugs that look like working code
    "C4",      # comprehensions that say the same thing twice
    "I",       # imports sorted, so a new one has one place to go
    "C901",    # complexity (Sonar S3776 is cognitive; this is cyclomatic)
    "N",       # naming (Sonar S117, S1542)
    "A",       # a name that shadows a builtin
    "ARG",     # unused arguments (Sonar S1172)
    "BLE",     # `except Exception` that hides the real error
    "S110", "S112",  # try/except/pass and try/except/continue
    "ISC",     # implicit string concatenation - a missing comma in a list
    "PIE", "RET", "SIM",  # redundant code, and the simpler form of it
    "PLE", "PLW",  # pylint's errors and warnings
    "PLR0913", # too many parameters (Sonar S107)
    "PLC0206", # a dict walked by key, then indexed by it: .items() says it once
    "FURB",    # refurb: the newer stdlib spelling (removeprefix, `or`, writelines)
    "PERF",    # a loop that only appends is a comprehension
    "UP020",   # io.open is open
    "RUF010", "RUF012", "RUF015", "RUF019", "RUF059", "RUF100",
]
ignore = [
    "N812",    # `import query as Q` is the project's idiom, used everywhere
    "PLW0603", # `global` for a module's lazily loaded cache is what it is for
    "SIM905",  # a word list written as one "...".split() reads better
    "FURB167", # re.I vs re.IGNORECASE is spelling, not a simpler form
]
# Nothing else is ignored: every rule above blocks a push. The ratchet that
# let the rules with findings through one at a time emptied on 2026-09-30.

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 13                           # Sonar S107's threshold
